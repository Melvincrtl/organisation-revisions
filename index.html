<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Indispensable pour que la page s'adapte à l'écran du téléphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes révisions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Mes révisions</h1>

    <!-- ===== Bloc : minuteur Pomodoro ===== -->
    <section class="bloc" id="bloc-minuteur">
      <h2>Minuteur</h2>
      <p id="minuteur-phase" class="minuteur-phase">Travail</p>
      <!-- Le temps, avec − à gauche et + à droite pour régler la durée du travail -->
      <div class="minuteur-affichage">
        <button type="button" id="bouton-moins" class="bouton-reglage" aria-label="Diminuer la durée de 5 minutes">−</button>
        <p id="minuteur-temps" class="minuteur-temps">25:00</p>
        <button type="button" id="bouton-plus" class="bouton-reglage" aria-label="Augmenter la durée de 5 minutes">+</button>
      </div>
      <!-- Message affiché à la fin d'une période (caché sinon) -->
      <p id="minuteur-message" class="minuteur-message" hidden></p>
      <div class="minuteur-boutons">
        <button type="button" id="bouton-demarrer">Démarrer</button>
        <button type="button" id="bouton-reinitialiser" class="bouton-secondaire">Réinitialiser</button>
      </div>
      <p id="texte-reglage" class="minuteur-aide discret"></p>
    </section>

    <!-- ===== Bloc : compteur du jour ===== -->
    <section class="bloc" id="bloc-compteur">
      <h2>Aujourd'hui</h2>
      <div class="compteurs">
        <div class="compteur">
          <span id="compteur-taches" class="compteur-nombre">0</span>
          <span id="libelle-taches" class="compteur-libelle">tâches faites</span>
        </div>
        <div class="compteur">
          <span id="compteur-temps" class="compteur-nombre">0 min</span>
          <span class="compteur-libelle">de travail</span>
        </div>
      </div>
    </section>

    <!-- ===== Bloc : planning de la semaine (géré par planning.js) =====
         Placé ici dans le HTML pour l'ordre sur téléphone (après « Aujourd'hui »,
         avant les tâches). Sur grand écran, style.css le place dans la colonne de droite. -->
    <section class="bloc" id="bloc-planning">
      <!-- Titre et bouton qui ouvre le formulaire (replié par défaut, pour laisser
           la place à la semaine) -->
      <div class="planning-titre">
        <h2>Planning</h2>
        <button type="button" id="bouton-ouvrir-creneau">+ Ajouter un créneau</button>
      </div>

      <!-- Ajout d'un créneau de révision (caché tant qu'on ne l'ouvre pas) -->
      <form id="form-creneau" class="form-creneau" hidden>
        <label class="champ-tache">
          Tâche existante (facultatif)
          <select id="champ-creneau-tache"></select>
        </label>
        <label class="champ-titre">
          Titre
          <input type="text" id="champ-creneau-titre" required placeholder="Ex. : Relire le cours d'audit">
        </label>
        <label class="champ-matiere">
          Matière
          <input type="text" id="champ-creneau-matiere" required placeholder="Ex. : Audit">
        </label>
        <label class="champ-jour">
          Jour
          <input type="date" id="champ-creneau-jour" required>
        </label>
        <label class="champ-heure">
          Début
          <input type="time" id="champ-creneau-debut" required>
        </label>
        <label class="champ-heure">
          Fin
          <input type="time" id="champ-creneau-fin" required>
        </label>
        <p id="message-creneau" class="message-creneau" hidden></p>
        <div class="form-creneau-boutons">
          <button type="submit" id="bouton-ajouter-creneau">Ajouter le créneau</button>
          <button type="button" id="bouton-fermer-creneau" class="bouton-secondaire">Fermer</button>
        </div>
      </form>

      <!-- Bandeau : semaine affichée et navigation -->
      <div class="planning-entete">
        <button type="button" id="bouton-semaine-precedente" class="bouton-secondaire" aria-label="Semaine précédente">‹</button>
        <p id="titre-semaine" class="titre-semaine"></p>
        <button type="button" id="bouton-semaine-suivante" class="bouton-secondaire" aria-label="Semaine suivante">›</button>
        <button type="button" id="bouton-cette-semaine" class="bouton-secondaire">Cette semaine</button>
      </div>

      <!-- Les 7 jours, remplis par planning.js -->
      <div id="semaine" class="semaine"></div>
    </section>

    <!-- ===== Bloc : liste de tâches ===== -->
    <section class="bloc" id="bloc-taches">
      <h2>Tâches</h2>

      <form id="form-tache">
        <label>
          Titre
          <input type="text" id="champ-titre" required placeholder="Ex. : Refaire l'exercice 3 sur les amortissements">
        </label>
        <label>
          Matière
          <input type="text" id="champ-matiere" required placeholder="Ex. : Comptabilité financière">
        </label>
        <!-- Cochée : la tâche est un examen, mise en surbrillance dans la liste -->
        <label class="case-option">
          <input type="checkbox" id="case-examen">
          C'est un examen
        </label>
        <!-- Décochée : la tâche n'a pas d'échéance et le champ de date disparaît -->
        <label class="case-option">
          <input type="checkbox" id="case-echeance" checked>
          Ajouter une échéance
        </label>
        <label id="bloc-echeance">
          Échéance
          <input type="date" id="champ-echeance" required>
        </label>
        <button type="submit" id="bouton-ajouter">Ajouter la tâche</button>
        <!-- Visible seulement pendant la modification d'une tâche -->
        <button type="button" id="bouton-annuler" class="bouton-secondaire" hidden>Annuler</button>
      </form>

      <!-- La liste est remplie par taches.js -->
      <ul id="liste-taches"></ul>
      <p id="message-vide" class="discret">Aucune tâche pour l'instant.</p>
    </section>

    <!-- ===== Bloc : synchronisation entre appareils (géré par synchro.js) ===== -->
    <section class="bloc" id="bloc-synchro">
      <h2>Synchronisation</h2>

      <!-- Non connecté : on reçoit un lien de connexion par mail -->
      <form id="form-connexion">
        <label>
          Adresse e-mail
          <input type="email" id="champ-email" required autocomplete="email" placeholder="prenom.nom@exemple.fr">
        </label>
        <button type="submit" id="bouton-lien">Recevoir le lien</button>
      </form>

      <!-- Connecté -->
      <div id="zone-connecte" hidden>
        <p class="synchro-adresse">Connecté : <strong id="adresse-connectee"></strong></p>
        <div class="synchro-boutons">
          <button type="button" id="bouton-synchroniser">Synchroniser maintenant</button>
          <button type="button" id="bouton-deconnexion" class="bouton-secondaire">Se déconnecter</button>
        </div>
      </div>

      <!-- Deux versions différentes : on te demande laquelle garder -->
      <div id="zone-conflit" class="synchro-conflit" hidden>
        <p id="texte-conflit"></p>
        <div class="synchro-boutons">
          <button type="button" id="bouton-garder-appareil">Garder celle de cet appareil</button>
          <button type="button" id="bouton-garder-en-ligne" class="bouton-secondaire">Garder celle en ligne</button>
        </div>
      </div>

      <p id="statut-synchro" class="synchro-statut discret">Non connecté</p>
    </section>
  </main>

  <!-- L'ordre compte :
       1. stockage.js d'abord : tous les autres fichiers l'utilisent.
       2. La bibliothèque Supabase (version exacte), puis synchro-config.js et synchro.js,
          AVANT taches.js, compteur.js et minuteur.js : ceux-ci appellent
          signalerModificationLocale() (synchro.js) dès qu'ils écrivent des données,
          parfois dès le chargement (le minuteur peut compter une période terminée).
          Si la bibliothèque ne se charge pas (hors connexion), le reste fonctionne. -->
  <script src="stockage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="synchro-config.js"></script>
  <script src="synchro.js"></script>
  <script src="taches.js"></script>
  <!-- compteur.js avant minuteur.js : au chargement, le minuteur peut
       avoir besoin de compter une session terminée pendant l'absence -->
  <script src="compteur.js"></script>
  <!-- planning.js après taches.js (dateDuJour) et compteur.js (formaterDureeTravail) -->
  <script src="planning.js"></script>
  <script src="minuteur.js"></script>
</body>
</html>
