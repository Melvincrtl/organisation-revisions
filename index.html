<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Indispensable pour que la page s'adapte à l'écran du téléphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes révisions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Mes révisions</h1>

    <!-- ===== Bloc : minuteur Pomodoro ===== -->
    <section class="bloc" id="bloc-minuteur">
      <h2>Minuteur</h2>
      <p id="minuteur-phase" class="minuteur-phase">Travail</p>
      <p id="minuteur-temps" class="minuteur-temps">25:00</p>
      <!-- Message affiché à la fin d'une période (caché sinon) -->
      <p id="minuteur-message" class="minuteur-message" hidden></p>
      <div class="minuteur-boutons">
        <button type="button" id="bouton-demarrer">Démarrer</button>
        <button type="button" id="bouton-reinitialiser" class="bouton-secondaire">Réinitialiser</button>
      </div>
    </section>

    <!-- ===== Bloc : compteur du jour ===== -->
    <section class="bloc">
      <h2>Aujourd'hui</h2>
      <div class="compteurs">
        <div class="compteur">
          <span id="compteur-taches" class="compteur-nombre">0</span>
          <span id="libelle-taches" class="compteur-libelle">tâches faites</span>
        </div>
        <div class="compteur">
          <span id="compteur-pomodoros" class="compteur-nombre">0</span>
          <span id="libelle-pomodoros" class="compteur-libelle">sessions Pomodoro</span>
        </div>
      </div>
    </section>

    <!-- ===== Bloc : liste de tâches ===== -->
    <section class="bloc">
      <h2>Tâches</h2>

      <form id="form-tache">
        <label>
          Titre
          <input type="text" id="champ-titre" required placeholder="Ex. : Refaire l'exercice 3 sur les amortissements">
        </label>
        <label>
          Matière
          <input type="text" id="champ-matiere" required placeholder="Ex. : Comptabilité financière">
        </label>
        <!-- Cochée : la tâche est un examen, mise en surbrillance dans la liste -->
        <label class="case-option">
          <input type="checkbox" id="case-examen">
          C'est un examen
        </label>
        <!-- Décochée : la tâche n'a pas d'échéance et le champ de date disparaît -->
        <label class="case-option">
          <input type="checkbox" id="case-echeance" checked>
          Ajouter une échéance
        </label>
        <label id="bloc-echeance">
          Échéance
          <input type="date" id="champ-echeance" required>
        </label>
        <button type="submit" id="bouton-ajouter">Ajouter la tâche</button>
        <!-- Visible seulement pendant la modification d'une tâche -->
        <button type="button" id="bouton-annuler" class="bouton-secondaire" hidden>Annuler</button>
      </form>

      <!-- La liste est remplie par taches.js -->
      <ul id="liste-taches"></ul>
      <p id="message-vide" class="discret">Aucune tâche pour l'instant.</p>
    </section>
  </main>

  <!-- L'ordre compte : stockage.js d'abord, car taches.js l'utilise -->
  <script src="stockage.js"></script>
  <script src="taches.js"></script>
  <!-- compteur.js avant minuteur.js : au chargement, le minuteur peut
       avoir besoin de compter une session terminée pendant l'absence -->
  <script src="compteur.js"></script>
  <script src="minuteur.js"></script>
</body>
</html>
